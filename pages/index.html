<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A better version of Soap2DayHDZ.">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/manifest.json">
    <title>BetterSoap</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            max-width: 100vw;
        }

        * {
            font-family: sans-serif;
        }

        .hidden {
            display: none !important;
        }

        #container {
            max-width: 900px;
            margin: auto;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0.5rem;
        }

        h1 {
            margin: 0;
            padding: 0;
            font-size: 1.5rem;
            text-align: center;
        }

        h2 {
            margin: 0;
            padding: 0;
            font-size: 1.25rem;
        }

        p {
            margin: 0;
            padding: 0;
            text-align: center;
        }

        a {
            text-decoration: none;
            color: inherit;
            text-decoration: underline;
        }

        a:hover {
            color: #337AB7;
        }

        button {
            cursor: pointer;
            transition: all 0.1s ease;
        }

        button.active {
            color: #337AB7;
            font-weight: bold;
            border-radius: 20px;
            border-width: 0;
        }

        #url-container {
            display: flex;
            flex-direction: row;
            gap: 0.2rem;
        }
        
        #url-container > input, #url-container > button {
            padding: 0.2rem 0.4rem;
        }

        #vid-player-container {
            position: relative;
            aspect-ratio: 16 / 9;
            background-color: #337AB7;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #vid-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #vid-spinner {
            position: absolute;
            z-index: 2;
        }

        #controls-container {
            display: flex;
            flex-direction: row;
            gap: 0.5rem;
        }

        #servers-container {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        #servers-container button {
            width: 5rem;
            height: 2rem;
        }

        #episodes-container {
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;
            justify-content: flex-start;
            align-content: start;
            gap: 0.2rem;
        } 
        
        #episodes-container button {
            width: 2rem;
            height: 2rem;
        }

        #spinner {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #spinner > svg, #vid-spinner > svg {
            width: 4rem;
            height: 4rem;
        }

        .spinner-path {
            transform-origin: 18px 18px; 
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #url-in {
            flex: 1;
        }
    </style>
    <script>
        let server = -1;
        let ep = -1;
        let loading = false;
        let loadingVid = false;

        function fastHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = (hash << 5) - hash + char;
                hash |= 0;
            }
            return (hash >>> 0).toString(16);
        }
    </script>
</head>
<body>
    <main id="container">
        <h1>BetterSoap</h1>
        <div id="url-container">
            <select id="recent-select" style="width: 4.5rem; cursor: pointer;">
                <option disabled selected hidden id="recent-select-lbl">Recents</option>
            </select>
            <input id="url-in" type="url" placeholder="Enter Soap2DayHDZ URL here ...">
            <button id="load-btn" type="submit">Load</button>
        </div>
        <div id="spinner" class="hidden">
            <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" stroke="#337AB7">
                <g fill="none" fill-rule="evenodd">
                    <g transform="translate(2 2)" stroke-width="4">
                        <circle stroke-opacity=".25" cx="18" cy="18" r="18"/>
                        <path class="spinner-path" d="M36 18c0-9.94-8.06-18-18-18" />
                    </g>
                </g>
            </svg>
        </div>
        <div id="vid-player-container" class="hidden">
            <div id="vid-spinner" class="hidden">
                <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" stroke="white">
                    <g fill="none" fill-rule="evenodd">
                        <g transform="translate(2 2)" stroke-width="4">
                            <circle stroke-opacity=".25" cx="18" cy="18" r="18"/>
                            <path class="spinner-path" d="M36 18c0-9.94-8.06-18-18-18" />
                        </g>
                    </g>
                </svg>
            </div>
            <iframe 
                id="vid-player" 
                title="Video player" 
                allowfullscreen 
                frameborder="0"
            ></iframe>
        </div>
        <h2 id="vid-title" class="hidden" ></h2>
        <div id="controls-container" class="hidden">
            <div id="servers-container"></div>
            <div id="episodes-container"></div>
        </div>
        <p>Made with ❤️ by <a href="https://github.com/ManbirJudge" target="_blank">Manbir Judge</a> &bull; <a href="https://github.com/ManbirJudge/better-soap" target="_blank">GitHub</a></p>
    </main>
    <script>
        const loadBtn = document.getElementById("load-btn");
        const recentSelect = document.getElementById("recent-select");
        const urlIn = document.getElementById("url-in");
        const spinner = document.getElementById("spinner");
        const vidPlayerCont = document.getElementById("vid-player-container");
        const vidLoader = document.getElementById("vid-spinner");
        const vidPlayer = document.getElementById("vid-player");
        const vidTitle = document.getElementById("vid-title");
        const serversContainer = document.getElementById("servers-container");
        const episodesContainer = document.getElementById("episodes-container");

        const vidRelElements = [vidPlayerCont, vidTitle, document.getElementById("controls-container")]

        function reloadVid() {
            if (loadingVid) return;
            loadingVid = true;

            if (server < 0 || ep < 0) return;

            loadBtn.disabled = true;
            urlIn.disabled = true;
            vidLoader.classList.remove("hidden");
            vidPlayer.classList.add("hidden");
            vidPlayer.removeAttribute("src");

            localStorage.setItem("server", server);
            localStorage.setItem(`${fastHash(info.title)}-ep`, ep);

            fetch(`./api/iframe?url=${encodeURIComponent(urlIn.value)}&server=${server}&ep=${ep}`).then(res => res.json()).then(res => {
                const json = JSON.parse(res);

                vidPlayer.setAttribute("src", json.iframeUrl);
            }).catch(e => {
                console.log("Error:", e);
            }).finally(() => {
                loadBtn.disabled = false;
                urlIn.disabled = false;
                vidLoader.classList.add("hidden");
                vidPlayer.classList.remove("hidden");

                loadingVid = false;
            });
        }

        function getRecents() {
            const stored = localStorage.getItem("recents");
            return stored ? JSON.parse(stored) : [];
        }

        function updateRecents(recents, updateLocalStoarge = true) {
            if (updateLocalStoarge) localStorage.setItem("recents", JSON.stringify(recents));

            while (recentSelect.lastChild.id !== "recent-select-lbl") {
                recentSelect.removeChild(recentSelect.lastChild);
            }
            recents.forEach(r => {
                const opt = document.createElement("option");
                opt.setAttribute("value", r.title);
                opt.innerText = r.title;

                recentSelect.appendChild(opt);
            });
        }
        
        function addToRecents(title, url) {
            let recents = getRecents();
            recents = recents.filter(r => r.title !== title);
            recents.unshift({ title, url });

            if (recents.length > 16) recents.splice(16);

            updateRecents(recents);
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateRecents(getRecents(), false);
        });

        loadBtn.addEventListener("click", evt => {
            if (loading) return;
            loading = true;

            loadBtn.disabled = true;
            urlIn.disabled = true;
            spinner.classList.remove("hidden");
            vidRelElements.forEach(ele => ele.classList.add("hidden"));

            const url = urlIn.value;

            fetch(`./api/info?url=${encodeURIComponent(url)}`).then(res => res.json()).then(res => {
                const info = JSON.parse(res);

                const storedServer = parseInt(localStorage.getItem("server"));
                const storedEp = parseInt(localStorage.getItem(`${fastHash(info.title)}-ep`));

                server = (storedServer && info.servers.includes(storedServer)) ? storedServer : info.servers[0];
                ep = (storedEp && info.episodes.includes(storedEp)) ? storedEp : info.episodes[0];

                vidTitle.innerText = info.title;
                serversContainer.innerHTML = info.servers.map(srv => `<button data-type="server" data-id="${srv}" ${server == srv && "class=\"active\""}>Server ${srv}</button>`).join("");
                episodesContainer.innerHTML = info.episodes.map(e => `<button data-type="ep" data-id="${e}" ${e == ep && "class=\"active\""}>${e}</button>`).join("");

                vidRelElements.forEach(ele => ele.classList.remove("hidden"));

                addToRecents(info.title, url);
            }).catch(e => {
                server, ep = -1, -1;

                console.log("Error:", e);
            }).finally(() => {
                loadBtn.disabled = false;
                urlIn.disabled = false;
                spinner.classList.add("hidden");

                loading = false;
                reloadVid();
            });
        });

        document.addEventListener("click", evt => {
            const btn = evt.target.closest("button");
            if (!btn) return;

            const { type, id } = btn.dataset;

            if (type && id) {
                if (type === "server") {
                    server = parseInt(id);
                    serversContainer.querySelectorAll("button").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                } else if (type === "ep") {
                    ep = parseInt(id);
                    episodesContainer.querySelectorAll("button").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                }
                reloadVid();
            }
        });

        recentSelect.addEventListener("change", () => {
            const selected = recentSelect.value;

            const _done = getRecents().some(r => {
                if (r.title === selected) {
                    urlIn.value = r.url;
                    return true;
                }
                return false;
            })

            recentSelect.selectedIndex = 0;
        });
    </script>
</body>
</html>
